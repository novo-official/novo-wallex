# Live / shadow engine (Phase 5, minimal, 1-day run). Every field here enters the config hash.

[challenge]
# Asia/Tehran. Set from GET /v1/prop/user/packages/history expire_at (step 0) unless the user says otherwise.
# preflight FAILS while this is empty.
end = ""
start_equity_tmn = "5000000"

[risk]                         # tightened for the 1-day run (user, 2026-10-22); RiskGuard enforces it
max_position_fraction = "0.15"
max_total_exposure = "0.45"
kill_switch = "-0.025"         # from the starting equity: flatten to TMN and halt
daily_loss_limit = "-0.02"
min_order_tmn = "50000"        # the exchange minimum (ramped core orders and activity trades are smaller than 500k)
no_entry_before_end_minutes = 120
flatten_before_end_minutes = 60
ramp_hours = 2                 # sizes x ramp_factor for the first hours of live
ramp_factor = "0.5"

[engine]
loop_seconds = 15
reconcile_seconds = 30
candle_refresh_seconds = 60
history_days = 50              # enough for the 4h EMA200 (~33 days)
entry_timeout_minutes = 15     # maker entry limit: cancel if not filled
flatten_limit_timeout_seconds = 120   # flatten: limit at best ask first, then market
max_consecutive_errors = 5     # then: halt new entries, keep managing exits

[ai_activity]                  # user decision 2026-10-22: trend OFF; the only live module. Every entry = ML rank +
enabled = true                 # Officer risk_mode != OFF + Trade Agent approval + RiskGuard
column = "ml_net_h24"
symbols = ["BTCTMN", "ETHTMN", "USDTTMN"]
notional_tmn = "250000"        # per trade (or the exchange minimum if higher); sized against the 15% cap
slot_minutes = 60
min_spacing_minutes = 45
max_per_day = 12
max_concurrent = 2
take_profit = 0.008            # resting maker limit
stop = 0.010                   # engine-side, against the best bid
max_hold_bars = 24             # 2 h of 5m bars, then limit at best -> market
entry_timeout_minutes = 3.0    # maker limit at the best bid, one reprice, then cancel
reprices = 1

[activity]                     # superseded by [ai_activity] (kept for the record; off)
enabled = false
module_name = "activity"
column = "ml_net_h24"
threshold = -0.005
hold_bars = 24
stop = 0.015
notional_tmn = 100000
max_entries_per_day = 2

[llm]
officer = true                 # hourly Regime/Risk Officer (local model); exits always run without it
trade_agent = true
mode = "live"                  # local Ollama first; free fallbacks only if configured in .env
