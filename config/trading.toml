# Trading universe and market data settings.
#
# Default-deny: a symbol is tradable only if it is listed in `allowlist` AND is not
# in blocked_markets.txt. Entries may be BASE/QUOTE or API symbols (OP/TMN or OPTMN).

[markets]
# Proposed allowlist. Checked against the real markets capture: all 11 are spot,
# TMN-quoted, and absent from blocked_markets.txt.
allowlist = [
  "USDTTMN", "BTCTMN", "ETHTMN", "SOLTMN", "XRPTMN", "DOGETMN",
  "TRXTMN", "ADATMN", "BNBTMN", "LTCTMN", "SHIBTMN",
]

[data]
# Read-only data universe: market data may be downloaded and recorded for these
# symbols (plus the allowlist), but they are never traded unless also allowlisted.
# The USDT pairs feed the fair-value feature (price_USDT * USDTTMN). Blocked
# symbols here make the policy fail to load.
symbols = [
  "BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT",
  "TRXUSDT", "ADAUSDT", "BNBUSDT", "LTCUSDT", "SHIBUSDT",
]

[recorder]
# Orderbook/trades/ticker recorder (record_orderbook). Orderbook history cannot be
# downloaded later, so this runs from day one. Request budget at these settings:
# 21 depth requests per 10 s + 21 trades requests per 30 s + 1 markets request per
# 60 s, about 2.8 requests/s.
out_dir = "data/orderbook"
depth_interval_seconds = 10
depth_levels = 20
trades_interval_seconds = 30
tickers_interval_seconds = 60
flush_interval_seconds = 60
max_requests_per_second = "6"

[universe]
# Proposed thresholds, not yet calibrated. Volume is in the quote asset (TMN).
quote_asset = "TMN"
min_quote_volume_24h = "1000000000"  # 1e9 TMN over 24h
max_spread_fraction = "0.005"        # 0.5% of mid price

[history]
# Probe 2026-10-22: resolution "1" returns full windows up to at least 2041 bars
# (34 h) but a single bar for a 48 h window, without an error. 1440 bars (24 h)
# stays well inside that. Resolution "60" returns only the latest 696 bars.
# Valid resolutions: 1, 15, 60, 240, 720, 1D; but 15 returns 1m bars and
# 240/720 return 1h bars, so we download 1m and resample locally.
chunk_bars = 1440
requests_per_second = "3"  # shared with the recorder's ~2.8 req/s
