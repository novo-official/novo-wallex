# Strategy, backtest and window-study settings. Everything here enters the config hash.

[backtest]
initial_equity = "5000000"
# Defaults until the organizers confirm our fees (CLAUDE.md §5). TMN-quoted markets.
fee_maker = "0.0025"
fee_taker = "0.0035"
fee_stress = "1.5"              # the fee-stress case multiplies both fees
slippage_file = "config/slippage.json"  # frozen taker slippage per symbol, from measure_costs
default_slippage = "0.002"      # for a symbol with no recorded book
# TMN markets the strategy may trade (a subset of markets.allowlist in trading.toml).
tradable = [
  "USDTTMN", "BTCTMN", "ETHTMN", "SOLTMN", "XRPTMN", "DOGETMN",
  "TRXTMN", "ADATMN", "BNBTMN", "LTCTMN", "SHIBTMN",
]

[windows]
window_days = 3.0
step_hours = 12.0
warmup_days = 10.0
selection_share = 0.7     # parameters are chosen on the first 70% of windows
min_positive = 0.60       # objective constraints (CLAUDE.md §7)
min_p10_drawdown = -0.04

# Canonical strategy parameters (the one the engine runs). Missing keys use the code defaults.
# Evidence: reports/edge-2026-10-22 (event study). Trend signals beat random entries only on
# BTCTMN/ETHTMN/USDTTMN, which are also the only TMN markets with MARKET orders and 2-4 bps
# slippage; every altcoin is negative. Exits must be wide (stop 1.5-2%, target 3-6%, hold up to
# 3 days) because the ~0.6% round trip otherwise eats the edge. Mean reversion: too few, negative.
[strategy]
modules = ["trend"]
symbols = ["USDTTMN", "BTCTMN", "ETHTMN"]

[strategy.trend]
trigger = "breakout"
require_4h = false
regime_exit = "none"
min_stop = 0.02          # fixed 2% stop: narrower stops are eaten by the ~0.6% round trip
max_stop = 0.02
tp_r = 3.0               # 6% target
min_tp = 0.0
trail_after_r = 0.0      # no breakeven/trailing stop: it cut the winners (reports/windows-2026-10-22)
# Chosen by reports/windows-2026-10-22 (params #22); constraints not met, see docs/RESEARCH_P2.md.
max_hold_bars = 864

[strategy.fair_value]
enabled = false

# Grid for the window study: dotted keys into [strategy], each a list of values.
# The cartesian product must stay at or below 50 combinations (here 48).
[grid]
"symbols" = [["USDTTMN", "BTCTMN", "ETHTMN"], ["USDTTMN", "BTCTMN", "ETHTMN", "SOLTMN", "BNBTMN"]]
"trend.require_4h" = [true, false]
"trend.regime_exit" = ["1h", "4h", "none"]
"trend.tp_r" = [2.0, 3.0]
"trend.trail_after_r" = [0.0, 2.0]
